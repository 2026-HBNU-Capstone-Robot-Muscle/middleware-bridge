[workspace]
name = "middleware-bridge"
channels = ["https://prefix.dev/robostack-humble"]
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
ros-dev-tools = ">=1.0.3,<2"
ros-humble-rosbridge-suite = ">=2.0.8,<3"

[pypi-dependencies]
rubik-solver-py = "==0.1.1"
ultralytics = "==8.4.174"
torch = "==2.15.0"
pyserial = "==3.5"
stable-baselines3 = "==2.7.0"

[tasks]
check-execution-contract = "python -B scripts/check_execution_contract.py"
list-packages = "colcon list --base-paths src"
build-windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build_ros2.ps1"
rosbridge = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/run_rosbridge.ps1"
